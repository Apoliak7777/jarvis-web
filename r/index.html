<title>Rezervácia</title>
<style>
  :root { --accent: #2f6fed; --ink: #17202a; --muted: #5d6874; --line: #e3e7ec; --bg: #f5f7fa; --card: #fff; --ok: #1e8e5a; --bad: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 26px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; box-shadow: 0 12px 40px rgba(20, 30, 45, .06); }
  h1 { margin: 0 0 4px; font-size: 24px; } h2 { font-size: 15px; margin: 22px 0 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .muted { color: var(--muted); font-size: 14px; } .intro { white-space: pre-wrap; margin-top: 10px; }
  .services { display: grid; gap: 10px; }
  .svc { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fff; cursor: pointer; font: inherit; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .svc:hover, .svc.on { border-color: var(--accent); } .svc.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .svc b { display: block; } .svc span { color: var(--muted); font-size: 13.5px; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .day { flex: none; width: 74px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 6px; background: #fff; cursor: pointer; font: inherit; text-align: center; }
  .day small { display: block; color: var(--muted); font-size: 12px; text-transform: capitalize; } .day b { font-size: 18px; } .day.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, #fff); }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .time { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 4px; background: #fff; cursor: pointer; font: inherit; font-weight: 600; } .time:hover { border-color: var(--accent); } .time.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  form { display: grid; gap: 10px; margin-top: 8px; } label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 600; } .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
  input, textarea, select { font: inherit; padding: 10px 12px; border: 1px solid #cfd6de; border-radius: 9px; width: 100%; background: #fff; } textarea { min-height: 70px; resize: vertical; } .check input { width: auto; margin-top: 3px; }
  .hp { position: absolute; left: -9999px; }
  button.primary, a.btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; display: inline-block; }
  button.secondary { appearance: none; border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; background: #eef2f7; color: var(--ink); }
  button:disabled { opacity: .6; cursor: default; }
  .summary { border-radius: 12px; background: color-mix(in srgb, var(--accent) 7%, #fff); padding: 12px 14px; font-weight: 600; }
  .state { border-radius: 12px; padding: 16px 18px; margin-top: 16px; font-weight: 600; } .state.ok { background: #e8f6ef; color: var(--ok); } .state.bad { background: #fbeceb; color: var(--bad); }
  .error { color: var(--bad); font-size: 14px; min-height: 1em; } .privacy { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .people { display: flex; gap: 8px; flex-wrap: wrap; } .person { border: 1.5px solid var(--line); border-radius: 99px; padding: 8px 16px; background: #fff; cursor: pointer; font: inherit; font-weight: 600; } .person:hover { border-color: var(--accent); } .person.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .deposit { border-radius: 12px; padding: 14px 16px; margin-top: 14px; background: #fff7e6; border: 1px solid #f3d9a4; display: grid; gap: 10px; justify-items: start; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 18px; display: grid; gap: 8px; justify-items: start; } .box form { width: 100%; margin-top: 0; } .box b { font-size: 15px; }
  .two { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .rates { display: flex; gap: 8px; } .rate { width: 46px; height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font: inherit; font-weight: 700; font-size: 16px; } .rate:hover { border-color: var(--accent); } .rate.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; } footer a { color: inherit; }
</style>
