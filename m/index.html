    const join = async text => { const h = parse(text); if (!h.ok || !h.device) { error.textContent = t.bad; return; } error.textContent = ''; await take(h, true); show(el('p', {}, t.wait)); if (!(await worker())) { location.replace('/m/'); return; } open(true); };
    const paste = navigator.clipboard?.readText ? el('button', { type: 'button' }, t.paste) : null;
    paste?.addEventListener('click', async () => { let text = ''; try { text = await navigator.clipboard.readText(); } catch { error.textContent = t.pasteFail; field.focus(); return; } join(text).catch(() => { error.textContent = t.fail; }); });
    const form = el('form', {}, el('label', {}, t.field, field), el('button', { type: 'submit', class: 'ghost' }, t.join));
    form.addEventListener('submit', event => { event.preventDefault(); join(field.value).catch(() => { error.textContent = t.fail; }); });
    show(el('p', {}, t.home), paste, error, form, el('small', {}, t.secure));
  }

  /** Safari of an iPhone: the step to the home screen – this address carries the connection to the app added from here */
  async function homeScreen(paired) {
    const c = await get('spojenie'), cookie = await get('cookie');
    // only a working connection (a phone the PC unpaired gets the QR code again); the PC off is no reason to wait
    const res = !paired && c && cookie ? await fetch('/m/app/api/m/push', { cache: 'no-store' }).catch(() => null) : null;
    if (!c || !cookie || res?.status === 401) { show(el('p', {}, t.scan)); return; }
    const link = carried(c, cookie);
    history.replaceState(null, '', link);
    const note = el('p', { class: 'ok', role: 'status' }), copy = el('button', { type: 'button', class: 'ghost' }, t.copy);
    copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.origin + link); note.className = 'ok'; note.textContent = t.copied; } catch { note.className = 'err'; note.textContent = t.copyFail; } });
    // on in Safari: the address with the connection leaves this tab (replace, not a new step of its history)
    const later = el('a', { class: 'later', href: '/m/app/' + (paired ? '#/vitaj' : '') }, t.later);
    later.addEventListener('click', event => { event.preventDefault(); open(paired); });
    show(el('p', {}, paired ? t.paired : t.lead), el('ol', {}, el('li', {}, t.step1), el('li', {}, t.step2), el('li', {}, t.step3)), el('small', {}, t.carried), el('p', {}, t.hint), copy, note, later);
  }

  (async () => {
    if (!('serviceWorker' in navigator) || !window.crypto?.subtle || !window.indexedDB) { show(el('p', {}, t.browser)); return; }
    // the QR code (#k=…&p=…) or the carried connection (#k=…&d=…) – kept here, then gone from the address (and the history)
    const hash = parse(location.hash), code = hash.code;
    if (location.hash) history.replaceState(null, '', '/m/');
    let fresh = false;
    if (hash.ok && hash.device) fresh = await take(hash);
    else if (hash.ok && code) { await put('spojenie', { ch: hash.ch, key: hash.key }); await put('cookie', null); }
    const c = await get('spojenie');
    if (!c) { notConnected(); return; }
    show(el('p', {}, t.wait));
    if (!(await worker())) { location.reload(); return; }
    if (!/^[\w-]{8,80}$/.test(code)) {
      if (ios && !standalone() && (hash.home || hash.device)) return homeScreen(false);
      open(fresh); return;
    }
    // a new phone: its name and one tap – the PC gives it its own key (the cookie of the pairing, kept by /m/sw.js)
    const name = el('input', { maxlength: '40', autocomplete: 'off', value: model() }), error = el('p', { class: 'err', role: 'alert' }), go = el('button', { type: 'submit' }, t.pair);
    const form = el('form', {}, el('label', {}, t.name, name), error, go);
    form.addEventListener('submit', async event => {
      event.preventDefault(); go.disabled = true; error.textContent = '';
      try {
        const res = await fetch('/pair.json', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ k: code, name: name.value.trim() || model() }) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || t.fail);
        // an iPhone in Safari: the app on the home screen has its own storage – the step that carries the connection to it
        if (ios && !standalone()) return homeScreen(true);
        open(true);
      } catch (e) { error.textContent = e.message || t.fail; go.disabled = false; }
    });
    show(el('p', {}, t.ask), form, el('small', {}, t.secure));
  })().catch(() => show(el('p', {}, t.fail)));
})();
</script>
</body>
